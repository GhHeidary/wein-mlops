# Datei: compose.yaml – in VS Code einfügen und speichern
# compose.yaml
# Docker Compose startet unseren MLflow-Server mit einem Befehl.

services:
  mlflow:
    build: docker/mlflow
    image: wein-mlflow:3.17.2
    container_name: mlflow-server
    ports:
      # Nur von diesem Rechner erreichbar (127.0.0.1).
      - "127.0.0.1:5000:5000"
    volumes:
      # Datenbank und Artefakte überleben einen Neustart.
      - mlflow-daten:/mlflow
    restart: unless-stopped

volumes:
  mlflow-daten:
    # Fester Name: Compose nutzt dasselbe Volume wie docker run.
    name: mlflow-daten