# Datei: .github/workflows/ci.yml – in VS Code einfügen und speichern
# Continuous Integration: Zuerst die Tests (drei Python-Versionen), danach die Datenprüfung.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Jeden Montag um 06:17 Uhr deutscher Zeit
    - cron: "17 6 * * 1"
      timezone: "Europe/Berlin"

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Code holen
        uses: actions/checkout@v7

      - name: Python ${{ matrix.python-version }} einrichten
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Pakete installieren
        run: pip install -r requirements-ci.txt

      - name: Tests ausführen
        run: pytest -v

  datenpruefung:
    # Dieser Job startet erst, wenn alle Test-Jobs grün sind.
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v7

      - name: Python 3.12 einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Pakete installieren
        run: pip install -r requirements-ci.txt

      - name: Daten erzeugen
        run: python src/daten_exportieren.py

      - name: Daten validieren
        run: python src/pipeline/validieren.py