# Datei: monitoring/prometheus.yml – in VS Code einfügen und speichern
# Einstellungen für Prometheus (ab Tag 19).
# Prometheus holt alle 5 Sekunden die Metriken der Wein-API ab ("scrapen").

global:
  scrape_interval: 5s
  # Alle 5 Sekunden prüft Prometheus die Alarmregeln.
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alarme.yml

scrape_configs:
  - job_name: wein-api
    # Im Compose-Netzwerk heißt die API "api". Prometheus fragt http://api:8000/metrics.
    static_configs:
      - targets: ["api:8000"]